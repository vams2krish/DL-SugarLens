name: Validate SugarLens
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - run: npx playwright install --with-deps chromium
      - name: Verify the production photo-to-result flow
        run: |
          npm run preview -- --port 4173 > /tmp/sugarlens-preview.log 2>&1 &
          npm run test:e2e
      - name: Preserve product verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sugarlens-product-verification
          path: |
            docs/showcase-*.png
            docs/verification*.json
            docs/verification-failure.png
